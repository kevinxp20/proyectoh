<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Comics Search - Python Version</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" />
    <script language="javascript" type="text/javascript">

        function fncBusca(form) {
            var characterId = form.txtBusq.value;
            
            if (!characterId) {
                alert('Por favor ingrese un ID de personaje');
                return;
            }
            
            // Clear previous results
            $("#artDatos").html('<p>Cargando...</p>');
            
            // Call Python backend API
            $.getJSON('/api/search', { character_id: characterId })
            .done(function(data) {
                var htmlDato = "<h3>Títulos donde aparece</h3>";
                var intI = 0;
                
                if (data.data && data.data.results && data.data.results.length > 0) {
                    $.each(data.data.results, function(k, val) {
                        htmlDato += "<li id='" + k + "'>" + val.title + " <br/>Descripción: " + (val.description || 'Sin descripción disponible') + " <br/>";
                        htmlDato += "<div class=\"carousel slide\" id=\"carouselExample" + k + "\" name=\"carouselExample" + k + "\"> <div class=\"carousel-inner\">";
                        
                        if (val.images && val.images.length > 0) {
                            $.each(val.images, function(i, mival) {
                                var activeClass = (i === 0) ? "active" : "";
                                htmlDato += "<div class=\"carousel-item " + activeClass + "\"><img src=\"" + mival.path + "/standard_fantastic.jpg\" class=\"rounded\" alt=\"" + i + "\" /></div>";    
                            });
                            htmlDato += "</div><button class=\"carousel-control-prev\" type=\"button\" data-bs-target=\"#carouselExample" + k + "\" data-bs-slide=\"prev\"> <span class=\"carousel-control-prev-icon\" aria-hidden=\"true\"></span><span class=\"visually-hidden\">Previous</span></button>  <button class=\"carousel-control-next\" type=\"button\" data-bs-target=\"#carouselExample" + k + "\" data-bs-slide=\"next\"> <span class=\"carousel-control-next-icon\" aria-hidden=\"true\"></span>    <span class=\"visually-hidden\">Next</span></button></div>";
                        } else {
                            htmlDato += "</div><p>No hay imágenes disponibles</p>";
                        }
                        
                        htmlDato += "</li><BR>";
                    });
                } else {
                    htmlDato += "<p>No se encontraron resultados para este personaje</p>";
                }
                
                $("#artDatos").html(htmlDato);                    
            })
            .fail(function(err) {
                console.log(err);
                $("#artDatos").html('<p class="text-danger">Error al buscar: ' + (err.responseJSON ? err.responseJSON.error : 'Error desconocido') + '</p>');
            });
        }
    </script>
</head>

<body class="container-fluid">
    <header class="container">
        <h1>My Character - Python Version</h1>
        <p class="text-muted">Aplicación convertida de JavaScript a Python usando Flask</p>
        <nav id="" name=""></nav>
    </header>
    <section class="container">
        <article class="container text-center">
            <h1>Buscar Comics por Personaje</h1>
            <form id="frmBusque" name="frmBusque" method="post" onsubmit="return false;">
                <div class="row">
                    <div class="col-2">
                        <input type="text" id="txtBusq" name="txtBusq" class="form-control" placeholder="ID del personaje" />
                    </div>
                    <div class="col-2">
                        <input type="button" id="btnBusq" name="btnBusq" class="btn btn-primary" value="Buscar" onclick="javascript: fncBusca(this.form);" />
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12">
                        <p class="text-muted small">Ejemplos: 1009368 (Iron Man), 1009610 (Spider-Man), 1009220 (Captain America)</p>
                    </div>
                </div>
            </form>
        </article>
        <article id="artDatos" name="artDatos">
        </article>
    </section> 
</body>
</html>
