<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="css/pagina.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Mi Gestor de Tareas</h1>
            <p class="subtitle">Organiza tus actividades diarias</p>
        </header>

        <main>
            <div class="task-input-section">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Escribe una nueva tarea..." 
                    maxlength="200"
                />
                <button id="addTaskBtn" onclick="addTask()">Agregar Tarea</button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" data-filter="all" onclick="filterTasks('all')">
                    Todas (<span id="count-all">0</span>)
                </button>
                <button class="filter-btn" data-filter="active" onclick="filterTasks('active')">
                    Pendientes (<span id="count-active">0</span>)
                </button>
                <button class="filter-btn" data-filter="completed" onclick="filterTasks('completed')">
                    Completadas (<span id="count-completed">0</span>)
                </button>
            </div>

            <ul id="taskList" class="task-list">
            </ul>

            <div class="empty-state" id="emptyState">
                <p>🎯 No hay tareas todavía</p>
                <p class="empty-subtitle">¡Agrega tu primera tarea arriba!</p>
            </div>

            <div class="actions-footer">
                <button id="clearCompletedBtn" onclick="clearCompleted()" class="secondary-btn">
                    Limpiar Completadas
                </button>
            </div>
        </main>

        <footer>
            <p>Creado con ❤️ para organizar tu día</p>
        </footer>
    </div>

    <script>
        let tasks = [];
        let currentFilter = 'all';
        let taskIdCounter = 0;

        function loadTasks() {
            const saved = localStorage.getItem('tasks');
            if (saved) {
                try {
                    tasks = JSON.parse(saved);
                    if (tasks.length > 0) {
                        let maxId = 0;
                        for (let i = 0; i < tasks.length; i++) {
                            if (tasks[i].id > maxId) {
                                maxId = tasks[i].id;
                            }
                        }
                        taskIdCounter = maxId + 1;
                    }
                } catch (e) {
                    tasks = [];
                    taskIdCounter = 0;
                    localStorage.removeItem('tasks');
                }
            }
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const taskText = input.value.trim();

            if (taskText === '') {
                input.focus();
                input.classList.add('error');
                setTimeout(() => input.classList.remove('error'), 500);
                return;
            }

            const newTask = {
                id: taskIdCounter++,
                text: taskText,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(newTask);
            input.value = '';
            saveTasks();
            renderTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function filterTasks(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const filterBtn = document.querySelector(`[data-filter="${filter}"]`);
            if (filterBtn) {
                filterBtn.classList.add('active');
            }
            renderTasks();
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
        }

        function getFilteredTasks() {
            if (currentFilter === 'active') {
                return tasks.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                return tasks.filter(t => t.completed);
            }
            return tasks;
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyState');
            const filteredTasks = getFilteredTasks();

            const allCount = tasks.length;
            const activeCount = tasks.filter(t => !t.completed).length;
            const completedCount = tasks.filter(t => t.completed).length;

            document.getElementById('count-all').textContent = allCount;
            document.getElementById('count-active').textContent = activeCount;
            document.getElementById('count-completed').textContent = completedCount;

            if (filteredTasks.length === 0) {
                taskList.style.display = 'none';
                emptyState.style.display = 'block';
            } else {
                taskList.style.display = 'block';
                emptyState.style.display = 'none';
            }

            taskList.innerHTML = filteredTasks.map(task => `
                <li class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-content">
                        <input 
                            type="checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onchange="toggleTask(${task.id})"
                            class="task-checkbox"
                        />
                        <span class="task-text">${escapeHtml(task.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})" title="Eliminar tarea">
                        🗑️
                    </button>
                </li>
            `).join('');

            const clearBtn = document.getElementById('clearCompletedBtn');
            clearBtn.style.display = completedCount > 0 ? 'block' : 'none';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        window.onload = function() {
            loadTasks();
        };
    </script>
</body>
</html>
